<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamara Private Chat Room</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a3c40 0%, #0b1d20 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 500px;
            height: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;

            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        h2 {
            color: white;
            text-align: center;
            margin: 5px 0 20px;
            font-size: 24px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;

            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
        }

        .msg {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .msg strong {
            color: #7ee7e7;
        }

        #message-form {
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #16a085;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #12876f;
        }

        /* Scrollbar */
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>💬 Private Chat Room</h2>

        <div id="chat-box"></div>

        <form id="message-form">
            <input
                type="text"
                id="message-input"
                placeholder="Message likho..."
                autocomplete="off"
                required
            >

            <button type="submit">Bhejo</button>
        </form>

    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const form = document.getElementById("message-form");
        const input = document.getElementById("message-input");
        const chatBox = document.getElementById("chat-box");

        // User ka naam
        const username = prompt("Apna naam daalein:") || "Anonymous";

        // Message bhejna
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const message = input.value.trim();

            if (message !== "") {
                socket.emit("chat message", {
                    user: username,
                    text: message
                });

                input.value = "";
                input.focus();
            }
        });

        // Message receive karna
        socket.on("chat message", function (data) {

            const item = document.createElement("div");
            item.classList.add("msg");

            const name = document.createElement("strong");
            name.textContent = data.user + ": ";

            const message = document.createTextNode(data.text);

            item.appendChild(name);
            item.appendChild(message);

            chatBox.appendChild(item);

            // Auto scroll
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>

</body>
</html>
